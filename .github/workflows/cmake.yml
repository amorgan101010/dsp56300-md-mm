name: CMake

on:
  workflow_dispatch:
  push:
    branches:
      - release/md-mm-alpha
  pull_request:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}${{ matrix.interpreter == 'ON' && ' (interpreter)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
        interpreter: ['OFF']
        include:
          - os: ubuntu-latest
            interpreter: 'ON'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DDSP56K_FORCE_INTERPRETER=${{ matrix.interpreter }}

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
